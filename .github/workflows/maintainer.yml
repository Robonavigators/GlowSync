name: GlowSync Maintainer

# Supervised maintenance: diagnose automatically; never push fixes or merge PRs.
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: glowsync-scheduled-maintainer
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check whether full maintenance is needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Every 30 minutes, check for new commits cheaply.
          # Run full checks once daily even if no code has changed.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M)" -lt 30 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git log -1 --format=%ct | awk -v now="$(date +%s)" '{exit (now-$1 <= 1800) ? 0 : 1}'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No recent changes; skipping expensive build." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Tool helper tests
        if: steps.gate.outputs.run == 'true'
        id: helpers
        continue-on-error: true
        run: python3 -m unittest discover -s tests -v
      - name: Android unit tests, lint and build
        if: steps.gate.outputs.run == 'true'
        id: android
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Emulator boot and launch smoke test
        id: emulator
        if: steps.gate.outputs.run == 'true' && steps.android.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.robonavigators.glowsync 1
            sleep 12
            adb shell pidof com.robonavigators.glowsync
      - name: Create or update a maintenance issue on failure
        if: steps.helpers.outcome == 'failure' || steps.android.outcome == 'failure' || steps.emulator.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Maintainer] Scheduled health check failed';
            const details = [
              'The scheduled GlowSync maintenance check found a failure.',
              '',
              '- Tool helper tests: ${{ steps.helpers.outcome }}',
              '- Android unit tests, lint and build: ${{ steps.android.outcome }}',
              '- Emulator launch smoke test: ${{ steps.emulator.outcome }}',
              '- Run: https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId,
              '',
              'Please review the logs and propose a fix through a pull request.',
              'Do not treat emulator or CI success as physical-TV validation.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: details
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body: details });
            }
      - name: Mark failed maintenance run
        if: steps.helpers.outcome == 'failure' || steps.android.outcome == 'failure'
        run: exit 1
