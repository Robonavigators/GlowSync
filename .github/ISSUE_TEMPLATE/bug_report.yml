name: Bug report
description: Report a reproducible GlowSync problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Device and setup
      description: TV model, Android version, WLED version, LED count, and whether this was an emulator or physical hardware. Do not include private addresses, credentials, or captured frames.
    validations:
      required: true
