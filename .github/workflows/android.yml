name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Tool helper tests
        run: python3 -m unittest discover -s tests -v
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlowSync-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish automatic preview APK release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="auto-${COMMIT_SHA:0:12}-${RUN_ID}"
          cp app/build/outputs/apk/debug/app-debug.apk GlowSync-preview-debug.apk
          gh release create "$tag" GlowSync-preview-debug.apk \
            --target "$COMMIT_SHA" \
            --title "GlowSync automatic preview ${COMMIT_SHA:0:7}" \
            --prerelease \
            --notes "Automated debug APK built from main at commit $COMMIT_SHA.

          This is an experimental debug build, not a signed production release.
          It has passed CI unit tests, lint and build checks, but has NOT been validated on physical TV/WLED hardware.
          Debug APK signatures can differ across build environments. An existing installation signed with another key may require uninstalling it first (which can remove app data)."
