name: Feature request
description: Suggest a focused improvement to GlowSync
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include any TV, WLED or accessibility context that would help.
    validations:
      required: true
